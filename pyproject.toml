[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-kbc-thesis"
version = "0.1.0"
description = "MSc research on knowledge base construction with large language models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
evaluation = ["pandas==2.2.3"]
inference = ["torch>=2.2,<3", "transformers==4.57.1", "huggingface-hub>=0.34,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"llm_kbc._vendor.lm_kbc_2026" = ["LICENSE", "provenance.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
